*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(180deg,#100838 0%,#2A205E 100%) fixed;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:72px 16px 60px}
h1{font-family:"DM Sans",sans-serif;font-size:1.43rem;font-weight:700;text-align:center;margin-bottom:10px}
p.sub{color:rgba(255,255,255,.75);font-size:.9rem;text-align:center;margin-bottom:34px}
#cert{max-width:min(100%,820px);max-height:62vh;width:auto;height:auto;border-radius:6px;box-shadow:0 14px 44px rgba(0,0,0,.45);margin-bottom:30px}
.actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
button{padding:13px 20px;border:none;border-radius:10px;font-size:.95rem;font-weight:600;cursor:pointer}
#pdfBtn{background:transparent;color:#fff;border:2px solid #fff}
#shareBtn{background:#fff;color:#2A205E}
button:active{transform:translateY(1px)}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#fff;color:#1c2536;border-radius:14px;max-width:480px;width:100%;padding:20px;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modal-head h2{font-size:1.05rem;font-family:"DM Sans",sans-serif;font-weight:700}
#closeShare{background:none;border:none;font-size:1.5rem;line-height:1;cursor:pointer;color:#6b7280;padding:2px 8px}
.net-row{display:flex;align-items:flex-start;gap:16px;overflow-x:auto;padding:4px 2px 14px}
.net{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.72rem;font-weight:400;line-height:1;color:#1c2536;text-decoration:none;min-width:62px;background:none;border:none;padding:0;margin:0;cursor:pointer;font-family:inherit;appearance:none;-webkit-appearance:none}
.ico{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ico svg{width:24px;height:24px}
.glyph{color:#fff;font-weight:700;font-size:1.25rem;font-family:Arial,sans-serif}
.copy-row{display:flex;gap:8px;background:#f2efe9;border-radius:10px;padding:8px;align-items:center}
#shareUrl{flex:1;border:none;background:none;font-size:.8rem;color:#1c2536;min-width:0;outline:none}
#copyBtn{background:#1c2536;color:#fff;border:none;border-radius:8px;padding:9px 16px;font-size:.8rem;font-weight:600;cursor:pointer}
</style>

  if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch(e){} }
  if (valid) drawText();
})();
document.getElementById("pdfBtn").addEventListener("click", function(){
  var orient = canvas.width >= canvas.height ? "landscape" : "portrait";
  var pdf = new jspdf.jsPDF({orientation: orient, unit: "px", format: [canvas.width, canvas.height]});
  pdf.addImage(canvas.toDataURL("image/jpeg", 0.92), "JPEG", 0, 0, canvas.width, canvas.height);
  pdf.save("certificado-" + fullName.replace(/\s+/g, "-").toLowerCase() + ".pdf");
});
var SHARE_TPL = "¡Hola a todos! Quiero compartirles que, como parte de mi formación continua y con el objetivo de seguir fortaleciendo mi práctica pedagógica, participé del Taller Introductorio sobre el uso de Valijas Adaptativas brindado por @Educabot.\n\nLas Valijas Adaptativas integran herramientas tecnológicas y analógicas pensadas para favorecer la autonomía y el acceso al aprendizaje, respetando distintas formas de aprender\nFue una experiencia sumamente enriquecedora que me permitió incorporar nuevos conocimientos y herramientas para acompañar trayectorias educativas diversas desde una mirada inclusiva.\nSigamos construyendo aulas que promuevan la accesibilidad, la participación y la equidad.";
var SHARE_TPL_X = "Participé del Taller Introductorio sobre el uso de Valijas Adaptativas de @Educabot 🎓 Herramientas para favorecer la autonomía y el acceso al aprendizaje desde una mirada inclusiva. ¡Sigamos construyendo aulas más accesibles y equitativas!";
var SHARE_TITLE = "Certificado";
function shareMsg(){ return SHARE_TPL.replace(/\{nombre\}/g, fullName); }
var modal = document.getElementById("shareModal");
document.getElementById("shareBtn").addEventListener("click", function(){
  var u = location.href, t = shareMsg();
  var eu = encodeURIComponent(u), et = encodeURIComponent(t);
  document.getElementById("shareUrl").value = u;
  document.getElementById("netWa").href = "https://wa.me/?text=" + encodeURIComponent(t + " " + u);
  document.getElementById("netFb").href = "https://www.facebook.com/sharer/sharer.php?u=" + eu;
  document.getElementById("netX").href = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(SHARE_TPL_X.replace(/\{nombre\}/g, fullName)) + "&url=" + eu;
  document.getElementById("netLi").href = "https://www.linkedin.com/sharing/share-offsite/?url=" + eu;
  document.getElementById("netTg").href = "https://t.me/share/url?url=" + eu + "&text=" + et;
  document.getElementById("netMail").href = "mailto:?subject=" + encodeURIComponent(SHARE_TITLE) + "&body=" + encodeURIComponent(t + "\n" + u);
  document.getElementById("netNative").style.display = navigator.share ? "" : "none";
  modal.style.display = "flex";
});
document.getElementById("closeShare").addEventListener("click", function(){ modal.style.display = "none"; });
modal.addEventListener("click", function(e){ if (e.target === modal) modal.style.display = "none"; });
document.getElementById("netIg").addEventListener("click", function(){
  var a = document.createElement("a");
  a.href = canvas.toDataURL("image/png");
  a.download = "certificado-" + fullName.replace(/\s+/g, "-").toLowerCase() + ".png";
  a.click();
  document.getElementById("igHint").style.display = "block";
  setTimeout(function(){ window.open("https://www.instagram.com/", "_blank"); }, 900);
});
document.getElementById("netImg").addEventListener("click", function(){
  var a = document.createElement("a");
  a.href = canvas.toDataURL("image/png");
  a.download = "certificado-" + fullName.replace(/\s+/g, "-").toLowerCase() + ".png";
  a.click();
});
document.getElementById("netNative").addEventListener("click", function(){
  canvas.toBlob(function(blob){
    var file = new File([blob], "certificado.png", {type: "image/png"});
    var data = {files: [file], title: SHARE_TITLE, text: shareMsg()};
    if (navigator.canShare && navigator.canShare(data)) {
      navigator.share(data).catch(function(){});
    } else if (navigator.share) {
      navigator.share({title: SHARE_TITLE, text: shareMsg(), url: location.href}).catch(function(){});
    }
  }, "image/png");
});
document.getElementById("copyBtn").addEventListener("click", function(){
  var inp = document.getElementById("shareUrl");
  inp.select(); inp.setSelectionRange(0, 99999);
  function ok(){ var b = document.getElementById("copyBtn"); b.textContent = "Copiado"; setTimeout(function(){ b.textContent = "Copiar"; }, 1500); }
  if (navigator.clipboard) { navigator.clipboard.writeText(inp.value).then(ok).catch(function(){ document.execCommand("copy"); ok(); }); }
  else { document.execCommand("copy"); ok(); }
});
</script>
